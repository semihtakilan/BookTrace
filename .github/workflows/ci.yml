name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Match the locally validated compiler; Release also guards the ViewModelHolder workaround.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  GOOGLE_BOOKS_API_KEY: ''

jobs:
  packages:
    name: Swift package tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and revision
        run: |
          mkdir -p build/ci
          git rev-parse HEAD | tee build/ci/revision.txt
          xcodebuild -version | tee build/ci/toolchain.txt
          swift --version | tee -a build/ci/toolchain.txt
      - name: Models tests
        run: |
          set -o pipefail
          swift test --package-path Models 2>&1 | tee build/ci/models-tests.log
      - name: NetworkKit tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          swift test --package-path NetworkKit 2>&1 | tee build/ci/network-tests.log
      - name: Shared persistence package build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          swift build --package-path BookTraceShared 2>&1 | tee build/ci/shared-build.log
      - name: Test summary
        if: always()
        run: |
          echo "## Package tests — $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          for log in build/ci/*-tests.log; do
            if [ -f "$log" ]; then
              echo "### $log" >> "$GITHUB_STEP_SUMMARY"
              grep -E 'Test run with|Executed .* tests|error:' "$log" | tail -15 >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-test-results
          path: build/ci/
          retention-days: 14

  ios:
    name: App and widget tests, Debug / Release builds
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and revision
        run: |
          mkdir -p build/ci
          git rev-parse HEAD | tee build/ci/revision.txt
          xcodebuild -version | tee build/ci/toolchain.txt
      # iOS 26.5 rejects local SKTestSession configuration in our validated setup.
      # Keep the compiler current while using the validated StoreKit test runtime.
      - name: Install the iOS 18.4 test runtime
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild -downloadPlatform iOS -buildVersion 18.4 -architectureVariant universal \
            2>&1 | tee build/ci/simulator-install.log
      - name: Create an iPhone with the exact test runtime
        run: |
          xcrun simctl list runtimes -j > build/ci/runtimes.json
          xcrun simctl list devices available -j > build/ci/devices.json
          python3 - <<'PY'
          import json, os, subprocess
          runtime_id = 'com.apple.CoreSimulator.SimRuntime.iOS-18-4'
          with open('build/ci/runtimes.json') as f:
              runtimes = json.load(f)['runtimes']
          if not any(r['identifier'] == runtime_id and r.get('version') == '18.4'
                     and r.get('isAvailable') for r in runtimes):
              raise SystemExit('Required iOS 18.4 runtime is unavailable; refusing to substitute another runtime')
          device_id = subprocess.check_output([
              'xcrun', 'simctl', 'create', 'BookTrace CI iOS 18.4',
              'com.apple.CoreSimulator.SimDeviceType.iPhone-16', runtime_id
          ], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SIMULATOR_UUID={device_id}\n')
          with open('build/ci/test-destination.txt', 'w') as f:
              f.write(f'iPhone 16 / iOS 18.4 / {device_id}\n')
          print(f'Using iPhone 16 (iOS 18.4): {device_id}')
          PY
      - name: Boot the test Simulator
        timeout-minutes: 5
        run: |
          xcrun simctl boot "$SIMULATOR_UUID"
          xcrun simctl bootstatus "$SIMULATOR_UUID" -b
      - name: Debug build
        run: |
          set -o pipefail
          xcodebuild -project BookTrace.xcodeproj -scheme BookTrace -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO SWIFT_EMIT_LOC_STRINGS=NO GOOGLE_BOOKS_API_KEY= \
            build 2>&1 | tee build/ci/debug-build.log
      - name: Verify app and widget test suites are in the shared scheme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          scheme = ElementTree.parse(Path('BookTrace.xcodeproj/xcshareddata/xcschemes/BookTrace.xcscheme'))
          enabled = {
              test.find('BuildableReference').attrib['BlueprintName']
              for test in scheme.findall('./TestAction/Testables/TestableReference')
              if test.attrib.get('skipped', 'NO') == 'NO'
          }
          assert {'BookTraceTests', 'BookTraceWidgetsTests'} <= enabled, enabled
          PY
      - name: App and widget tests
        run: |
          set -o pipefail
          xcodebuild -project BookTrace.xcodeproj -scheme BookTrace -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UUID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -resultBundlePath build/ci/AppTests.xcresult \
            -only-testing:BookTraceTests -only-testing:BookTraceWidgetsTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            SWIFT_EMIT_LOC_STRINGS=NO GOOGLE_BOOKS_API_KEY= \
            test 2>&1 | tee build/ci/app-tests.log
      - name: Release build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project BookTrace.xcodeproj -scheme BookTrace -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO SWIFT_EMIT_LOC_STRINGS=NO GOOGLE_BOOKS_API_KEY= \
            build 2>&1 | tee build/ci/release-build.log
      - name: Test and build summary
        if: always()
        run: |
          echo "## iOS validation — $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          for log in build/ci/*.log; do
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            grep -E 'Test run with|BUILD SUCCEEDED|BUILD FAILED|TEST SUCCEEDED|TEST FAILED|error:' "$log" | tail -15 >> "$GITHUB_STEP_SUMMARY" || true
          done
          if [ -d build/ci/AppTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/ci/AppTests.xcresult > build/ci/app-test-summary.json
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat build/ci/app-test-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation-results
          path: build/ci/
          retention-days: 14
